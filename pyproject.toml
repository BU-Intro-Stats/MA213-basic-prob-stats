[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "course-site-builder"
version = "0.1.0"
description = "Reusable schedule and MkDocs site generator for course websites."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
]

[tool.setuptools.packages.find]
include = ["course_site_builder*"]
